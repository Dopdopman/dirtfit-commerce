services:
  postgres:
    image: postgres:16-alpine
    container_name: dirtfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dirtfit
      POSTGRES_PASSWORD: dirtfit_local_dev_password
      POSTGRES_DB: dirtfit_db
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dirtfit -d dirtfit_db']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dirtfit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: dirtfit-adminer
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'

volumes:
  pg_data:
  redis_data:
