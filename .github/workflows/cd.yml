name: CD Production Deploy ($0 Free Tier)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    name: Migrate DB, Deploy API & Web, Verify Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema & apply migrations via DIRECT_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          pnpm --filter @dirtfit/api run db:validate
          pnpm --filter @dirtfit/api run db:migrate:deploy

      - name: Trigger API Deploy Hook (Render / Koyeb)
        if: ${{ secrets.API_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --show-error --silent -X POST "${{ secrets.API_DEPLOY_HOOK_URL }}"

      - name: Wait for API /health/ready (handles Free Tier cold start)
        if: ${{ secrets.API_BASE_URL != '' }}
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          for i in $(seq 1 36); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API_BASE_URL%/}/health/ready" || true)
            echo "Attempt $i -> /health/ready HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "API did not become ready within 180s"
          exit 1

      - name: Trigger Web Deploy Hook (Vercel)
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --show-error --silent -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

      - name: Post-deploy production smoke check
        if: ${{ secrets.API_BASE_URL != '' && secrets.WEB_BASE_URL != '' }}
        run: |
          node scripts/smoke-stack.mjs \
            --api-url "${{ secrets.API_BASE_URL }}" \
            --web-url "${{ secrets.WEB_BASE_URL }}" \
            --expect-prod
