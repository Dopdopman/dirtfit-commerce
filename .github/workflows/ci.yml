name: CI Quality, Security & Build Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Pure-JS, Lint, Format & Prisma Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:pure-js
      - run: pnpm lint
      - run: pnpm format:check
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://dirtfit:placeholder@localhost:5432/dirtfit_db
          DIRECT_URL: postgresql://dirtfit:placeholder@localhost:5432/dirtfit_db
        run: pnpm --filter @dirtfit/api run db:validate

  security-audit:
    name: Dependency Audit & Trivy FS Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Fails hard on any NEW high/critical production vulnerability.
      # Two upstream major-version advisories are explicitly allow-listed in root package.json
      # (pnpm.auditConfig.ignoreGhsas):
      #   - GHSA-mrhx-c7xc-m3w5 (zod <4.6.6 / CVE-2023-54404): locked to Zod v3 by fastify-type-provider-zod@4.0.2;
      #     mitigated by Fastify default 1MB bodyLimit + explicit .max() bounds on all array schemas.
      #   - GHSA-ggr8-5vv4-36mx (deepmerge-ts <8.0.0 / CVE-2026-40345): Prisma 6 CLI @prisma/config only;
      #     never called on untrusted HTTP JSON payloads.
      - name: Audit production dependencies (fail on high/critical)
        run: pnpm audit --prod --audit-level=high
      - name: Trivy filesystem vulnerability & misconfig scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  test-and-build:
    name: Full Integration Tests & Next.js Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dirtfit
          POSTGRES_PASSWORD: dirtfit_ci_password
          POSTGRES_DB: dirtfit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dirtfit -d dirtfit_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      PORT: 4000
      HOST: 0.0.0.0
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      LOG_LEVEL: warn
      SWAGGER_ENABLED: 'true'
      DATABASE_URL: postgresql://dirtfit:dirtfit_ci_password@localhost:5432/dirtfit_db
      DIRECT_URL: postgresql://dirtfit:dirtfit_ci_password@localhost:5432/dirtfit_db
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-jwt-access-secret-must-be-at-least-32-bytes-long-012345
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 14
      REFRESH_TOKEN_PEPPER: ci-test-refresh-pepper-must-be-at-least-32-bytes-long-012345
      COOKIE_SECRET: ci-test-cookie-secret-must-be-at-least-32-bytes-long-01234567
      COOKIE_SAME_SITE: lax
      COOKIE_SECURE: 'false'
      CRON_HMAC_SECRET: ci-test-cron-hmac-secret-must-be-at-least-32-bytes-long-012345
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      RATE_LIMIT_GLOBAL_MAX: 120
      RATE_LIMIT_AUTH_MAX: 10
      PAYMENT_DEFAULT_PROVIDER: MOCK
      ENABLE_MOCK_PAYMENT: 'true'
      MOCK_PAYMENT_WEBHOOK_SECRET: ci-mock-webhook-secret-123456
      PAYOS_CHECKSUM_KEY: ci-payos-checksum-key-123456
      RESERVATION_TTL_MINUTES: 15
      STORAGE_DRIVER: local
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dirtfit/api run db:generate
      - run: pnpm --filter @dirtfit/api run db:migrate:deploy
      - run: pnpm --filter @dirtfit/api run db:seed
      - run: pnpm test
      - name: Build Next.js storefront & admin portal
        env:
          NODE_ENV: production
        run: pnpm --filter @dirtfit/web build

  docker-build:
    name: Production Docker Build Verification
    needs: [guardrails]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: dirtfit-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build Web production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: dirtfit-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
