services:
  - type: web
    name: dirtfit-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: RUN_MIGRATIONS
        value: 'false'
      - key: RUN_SEED
        value: 'false'
      - key: PAYMENT_DEFAULT_PROVIDER
        value: PAYOS
      - key: ENABLE_MOCK_PAYMENT
        value: 'false'
      - key: STORAGE_DRIVER
        value: r2
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_SECURE
        value: 'true'
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 14
      - key: RATE_LIMIT_GLOBAL_MAX
        value: 120
      - key: RATE_LIMIT_AUTH_MAX
        value: 10
      - key: RESERVATION_TTL_MINUTES
        value: 15
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CRON_HMAC_SECRET
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: dirtfit-media
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: 'DirtFit Commerce <noreply@dirtfit.vn>'
