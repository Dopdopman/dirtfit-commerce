services:
  postgres:
    image: postgres:16-alpine
    container_name: dirtfit-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: dirtfit
      POSTGRES_PASSWORD: dirtfit_local_prod_password
      POSTGRES_DB: dirtfit_db
    ports:
      - '5432:5432'
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dirtfit -d dirtfit_db']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: dirtfit-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: dirtfit-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      LOG_LEVEL: info
      SWAGGER_ENABLED: 'false'
      DATABASE_URL: postgresql://dirtfit:dirtfit_local_prod_password@postgres:5432/dirtfit_db
      DIRECT_URL: postgresql://dirtfit:dirtfit_local_prod_password@postgres:5432/dirtfit_db
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-prod-smoke-jwt-access-secret-must-exceed-32-bytes-0123456789
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 14
      REFRESH_TOKEN_PEPPER: local-prod-smoke-refresh-pepper-must-exceed-32-bytes-0123456789
      COOKIE_SECRET: local-prod-smoke-cookie-secret-must-exceed-32-bytes-0123456789
      COOKIE_SAME_SITE: lax
      COOKIE_SECURE: 'false'
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CRON_HMAC_SECRET: local-prod-smoke-cron-hmac-secret-must-exceed-32-bytes-01234567
      RATE_LIMIT_GLOBAL_MAX: 120
      RATE_LIMIT_AUTH_MAX: 10
      PAYMENT_DEFAULT_PROVIDER: PAYOS
      ENABLE_MOCK_PAYMENT: 'false'
      PAYOS_CHECKSUM_KEY: local-prod-smoke-payos-checksum-key
      STORAGE_DRIVER: r2
      R2_ACCOUNT_ID: local-prod-placeholder-account
      R2_ACCESS_KEY_ID: local-prod-placeholder-access-key
      R2_SECRET_ACCESS_KEY: local-prod-placeholder-secret-key
      R2_BUCKET_NAME: dirtfit-media
      R2_PUBLIC_BASE_URL: https://cdn.dirtfit.vn
      GOOGLE_OAUTH_ENABLED: 'false'
      ENABLE_MOCK_OAUTH: 'false'
      CHAT_PROVIDER: fallback
      GEMINI_MODEL: gemini-2.5-flash
      CHAT_TIMEOUT_MS: 12000
      CHAT_RATE_LIMIT_MAX: 15
      CHAT_GUEST_SESSION_TTL_DAYS: 7
      RUN_MIGRATIONS: 'true'
      RUN_SEED: 'true'
    ports:
      - '4000:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_CDN_URL: https://cdn.dirtfit.vn
        NEXT_PUBLIC_APP_NAME: DirtFit Commerce
    container_name: dirtfit-web-prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_CDN_URL: https://cdn.dirtfit.vn
      NEXT_PUBLIC_APP_NAME: DirtFit Commerce
      INTERNAL_API_URL: http://api:4000
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 25s
      retries: 10

volumes:
  pg_data_prod:
  redis_data_prod:
